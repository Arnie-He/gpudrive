mode: "train"
use_rnn: false
eval_model_path: null
baseline: false
data_dir: data/processed/training
continue_training: false
model_cpt: null

environment: # Overrides default environment configs (see pygpudrive/env/config.py)
  name: "gpudrive"
  num_worlds: 75 # Number of parallel environments
  k_unique_scenes: 75 # Number of unique scenes to sample from
  max_controlled_agents: 1 
  max_num_agents_in_scene: 64
  ego_state: true
  road_map_obs: true
  partner_obs: true
  norm_obs: true
  remove_non_vehicles: true # If false, all agents are included (vehicles, pedestrians, cyclists)
  lidar_obs: false # NOTE: Setting this to true currently turns of the other observation types
  reward_type: "weighted_combination"
  collision_weight: -0.75
  off_road_weight: -0.75
  goal_achieved_weight: 1.0
  dynamics_model: "classic"
  collision_behavior: "ignore" # Options: "remove", "stop", "ignore"
  dist_to_goal_threshold: 2.0
  polyline_reduction_threshold: 0.1 # Rate at which to sample points from the polyline (0 is use all closest points, 1 maximum sparsity), needs to be balanced with kMaxAgentMapObservationsCount
  sampling_seed: 42 # If given, the set of scenes to sample from will be deterministic, if None, the set of scenes will be random
  obs_radius: 50.0 # Visibility radius of the agents
  road_obs_algorithm: "linear" # Algorithm for road observations: "linear" or "k_nearest_roadpoints"
  # action_type: "discrete" # Action space type: "discrete" or "continuous"
  action_space_steer_disc: 13
  action_space_accel_disc: 7
  # Versatile Behavior Diffusion (VBD): This will slow down training
  use_vbd: false
  vbd_model_path: "gpudrive/integrations/vbd/weights/epoch=18.ckpt"
  init_steps: 11
  vbd_trajectory_weight: 0.1 # Importance of distance to the vbd trajectories in the reward function
  vbd_in_obs: false
  init_mode: all_non_trivial

wandb:
  entity: "rl-power"
  project: "gpudrive-gail"
  group: "test"
  mode: "online" # Options: online, offline, disabled
  tags: ["gail", "ff"]

gail: # discriminator configs
  test_vanilla_ppo: false
  
  use_consecutive_obs: false
  discriminator_lr: 0.000005 # or should I use 1e-3?
  # data_batch_size: 32768
  # minibatch_size: 4096
  data_batch_size: 4096 # to be filled in at runtime
  num_minibatches: 8
  use_full_dataset: true
  discriminator_hidden_dim: 64
  discriminator_dropout: 0.01
  discriminator_wd: 0.001
  discriminator_use_input_norm: false
  evaluate_discriminator_every: 10

  reward_type: "airl"
  
  # Expert data generation options
  use_action: true
  use_generated_expert: true  # If true, use pretrained policy to generate expert trajectories; if false, use true expert data
  pretrained_model_name: "daphne-cornelisse/policy_S10_000_02_27"  # Hugging Face model name for pretrained policy
  expert_trajectory_batch_size: 32768
  expert_deterministic: false  # Whether to use deterministic policy for expert generation

train: # ppo configs
  exp_id: gail # Set dynamically in the script if needed
  save_model_every: 1000
  save_model_path: "irl/models"
  seed: 42
  cpu_offload: false
  device: "cuda"  # Dynamically set to cuda if available, else cpu
  bptt_horizon: 1
  compile: false
  compile_mode: "reduce-overhead"

  # # # Data sampling # # #
  resample_scenes: false
  resample_dataset_size: 10_000 # Number of unique scenes to sample from
  resample_interval: 2_000_000
  sample_with_replacement: true
  shuffle_dataset: false

  # # # PPO # # #
  torch_deterministic: false
  total_timesteps: 50_000_000_000
  batch_size: 32768
  num_minibatches: 64 # to be filled in at runtime
  minibatch_size: 1
  # batch_size: 4096
  # minibatch_size: 512
  learning_rate: 3e-4
  rl_weight_decay: 0.0 # seems like no weight decay is better for GAIL
  anneal_lr: false
  gamma: 0.99
  gae_lambda: 0.95
  update_epochs: 4
  norm_adv: true 
  clip_coef: 0.2
  clip_vloss: false
  vf_clip_coef: 0.2
  ent_coef: 0.0001
  vf_coef: 0.3
  max_grad_norm: 0.5
  target_kl: null
  log_window: 10

  # # # Network # # #
  network:
    input_dim: 64 # Embedding of the input features
    hidden_dim: 128 # Latent dimension
    dropout: 0.01
    # using_shared_embedding: true  # Set to false for separate actor/critic embeddings
    class_name: "NeuralNet"
    num_parameters: 0 # Total trainable parameters, to be filled at runtime

  # # # Checkpointing # # #
  checkpoint_interval: 400 # Save policy every k iterations
  checkpoint_path: "./runs"

  # # # Rendering # # #
  render: false # Determines whether to render the environment (note: will slow down training)
  render_3d: true # Render simulator state in 3d or 2d
  render_interval: 50 # Render every k iterations
  render_k_scenarios: 15 # Number of scenarios to render
  render_format: "mp4" # Options: gif, mp4
  render_fps: 15 # Frames per second
  zoom_radius: 50
  minimum_frames_to_log: 50

vec:
  backend: "native" # Only native is currently supported
  num_workers: 1
  env_batch_size: 1
  zero_copy: false